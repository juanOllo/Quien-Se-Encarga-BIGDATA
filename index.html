<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quien se encarga?</title>
    <link rel="stylesheet" href="styles.css">

    <!-- FONTS -->
        <!-- ffamily01 -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@100..800&family=Darumadrop+One&family=Palette+Mosaic&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
    <!--  -->
</head>
<body>
    
    <div class="container">

        <section id="new-user">
            <div class="new-user-container">
                <div class="title">Quien se encarga??</div>
                <p class="introduccion">
                    Bienvenido, esta es una web enfocada en la division de tareas, quehaceres o 
                    darle el uso que se te ocurra.
                </p>
                <span class="inputs-spans" style="display: flex; flex-direction: column; align-items: center; gap: 2rem;">
                    <span class="login-span">
                        <h3>Iniciar secion</h3>
                        <input type="text" class="name-input user-inputs" placeholder="Nombre">
                        <input type="password" class="pass-input user-inputs" placeholder="Contraseña">
                        <button class="login-btn user-btns">Iniciar</button>
                    </span>
                    <span class="new-user-span" style="display: none;">
                        <h3>Crear usuario</h3>
                        <input type="text" class="new-name-input user-inputs" placeholder="Introduce tu nombre">
                        <input type="password" class="new-pass-input user-inputs" placeholder="Crea una contraseña">
                        <button class="create-user-btn user-btns">Crear Usuario</button>
                    </span>
                    <button class="login-create-switch-btn" value="0">Crear nuevo usuario</button>
                </span>
            </div>
        </section>

        <section id="main-rooms" style="display: none;">
            <div class="option-btns-div">
                <button class="option-create-room-btn user-btns" value="create-room">CREAR SALA</button>
                <button class="option-join-room-btn user-btns" value="join-room">UNIRSE A UNA SALA</button>
            </div>
            <section id="room-options">
                <ul class="rooms-list">
                    <!-- id o value = codigo de la sala -->
                    <!-- <li class="room">
                        <h3>sala de coso</h3>
                        <button class="delete-room-btn user-btns" style="background-color: var(--rojo); float: right;">abandonar sala</button>
                    </li>
                    <li class="room">
                        <h3>sala de coso 2</h3>
                        <button class="delete-room-btn user-btns" style="background-color: var(--rojo); float: right;">abandonar sala</button>
                    </li> -->
                </ul>
            </section>
            <section id="create-room" style="display: none;">
                <h3>Crear una sala</h3>
                <input type="text" class="new-room-input-name user-inputs" placeholder="Nombre de la sala">
                <button class="new-room-btn user-btns">Crear</button>
            </section>
            <section id="join-room" style="display: none;">
                <h3>Unirse a una sala</h3>
                <input type="text" class="join-room-input-code user-inputs" placeholder="Codigo de la sala">
                <button class="join-room-btn user-btns">Unirse</button>
            </section>
            <div class="bottom-btns-div">
                <button class="logout-btn" style="border-radius: 2rem 2rem 1rem;">Cerrar secion</button>
                <button class="rooms-back-btn user-btns" style="border-radius: 2rem 2rem 1rem; font-size: 1rem;" value="room-options">Volver</button>
            </div>
        </section>

        <section id="main">
            <div class="title">Quien se encarga??</div>
            <div class="input-span">
                <input class="input-task" type="text" placeholder="Nueva Tarea">
                <button class="add-task">Añadir</button>
                <!-- EL TEXTAREA LO IMPLEMENTARE DESP DEL BACKEND -->
                <!-- <textarea class="input-task-information" placeholder="Añade mas información"></textarea> -->
            </div>
            <div class="tasks-div">
                <ul class="tasks-list">
                </ul>
            </div>
            <div class="bottom-btns-div">
                <button class="reload-btn">Recargar</button>
                <button class="inroom-back-btn">Volver</button>
                <button class="logout-btn">Cerrar secion</button>
            </div>
        </section>
    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
